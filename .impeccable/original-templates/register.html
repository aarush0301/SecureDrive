{% extends "base.html" %}
{% block body %}
  <h2>Create account</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input name="username" placeholder="Username (3-20 chars)" required><br>
    <input name="password" type="password" placeholder="Password (min 8 chars)" required><br>
    <button>Register</button>
  </form>
  <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
